[project]
name = "p2026-little-avator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "stoday", email = "stoday@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "akasha-terminal[light]>=1.7.3",
    "fastapi>=0.115",
    "PySide6>=6.8",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "uvicorn>=0.30",
    "graphifyy>=0.1.0",
    "a2a-sdk>=1.1.2",
    "zeroconf>=0.151.3",
    "dtri-meeting-room",
]

[project.scripts]
little-avatar = "p2026_little_avator:main"
little-avatar-server = "p2026_little_avator.api:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
data = { data = "skills" }

[tool.uv.sources]
dtri-meeting-room = { git = "https://github.com/stoday/dtri-meeting-room.git" }
